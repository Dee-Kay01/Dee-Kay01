name: Refresh market data

on:
  schedule:
    # 4:45 PM IST, Monday to Friday (after NSE close)
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_market.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/market.json; then
            echo "No change"
          else
            git config user.name "kosh-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/market.json
            git commit -m "Refresh market data"
            git push
          fi
