<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kosh: a simple, transparent investing app prototype">
<title>Kosh Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-sized working app, a slim presenter column beside it. Each thing lives in exactly one place. */
:root{
  --bg:#E4E9E6;--surface:#F3F4F1;--card:#FFFFFF;--fg:#111816;--muted:#4E5A55;--line:#DCE1DD;--line2:#E8ECE9;
  --accent:#1F3FBF;--accent-hover:#152E91;--on-accent:#FFFFFF;--accent-soft:#EEF1FD;
  --up:#0B7A43;--down:#B3261E;--warn-bg:#FFF4E0;--warn-fg:#6B4100;
  --ok-bg:#E3F1E8;--ok-fg:#0B5A33;--hi-bg:#FDE7E4;--hi-fg:#8E1F17;--vhi-bg:#8E1F17;--vhi-fg:#FFFFFF;
  --chip:#ECEFED;--chip-fg:#3A4541;--scrim:rgba(10,14,13,.45);--shadow:rgba(17,24,22,.22);
  --c1:#1F3FBF;--c2:#2E9E68;--c3:#B9A77A;--c4:#D08A2E;--c5:#9AA5A0;
  --font:'IBM Plex Sans','IBM Plex Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080B0A;--surface:#121816;--card:#1A2220;--fg:#E8EEEB;--muted:#A3B0AA;--line:#2B3532;--line2:#232C29;
  --accent:#8FA6FF;--accent-hover:#B3C2FF;--on-accent:#0B1230;--accent-soft:#1E2747;
  --up:#5FD49A;--down:#FF8A7A;--warn-bg:#33260C;--warn-fg:#F5C877;
  --ok-bg:#12301F;--ok-fg:#8BE3B1;--hi-bg:#3A1714;--hi-fg:#FFB1A6;--vhi-bg:#C2362A;--vhi-fg:#FFFFFF;
  --chip:#252F2C;--chip-fg:#C8D2CD;--scrim:rgba(0,0,0,.6);--shadow:rgba(0,0,0,.6);
  --c1:#8FA6FF;--c2:#5FD49A;--c3:#D9C796;--c4:#F0A955;--c5:#6F7B76;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080B0A;--surface:#121816;--card:#1A2220;--fg:#E8EEEB;--muted:#A3B0AA;--line:#2B3532;--line2:#232C29;
  --accent:#8FA6FF;--accent-hover:#B3C2FF;--on-accent:#0B1230;--accent-soft:#1E2747;
  --up:#5FD49A;--down:#FF8A7A;--warn-bg:#33260C;--warn-fg:#F5C877;
  --ok-bg:#12301F;--ok-fg:#8BE3B1;--hi-bg:#3A1714;--hi-fg:#FFB1A6;--vhi-bg:#C2362A;--vhi-fg:#FFFFFF;
  --chip:#252F2C;--chip-fg:#C8D2CD;--scrim:rgba(0,0,0,.6);--shadow:rgba(0,0,0,.6);
  --c1:#8FA6FF;--c2:#5FD49A;--c3:#D9C796;--c4:#F0A955;--c5:#6F7B76;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px;padding-inline:16px;max-width:1080px;margin:0 auto}
.phone{position:relative;width:390px;max-width:100%;height:min(820px,calc(100dvh - 48px));min-height:600px;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px var(--shadow)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scroll-behavior:smooth}
.zoom{zoom:var(--ts,1);padding-bottom:24px}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);height:66px;flex:none}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav svg{width:24px;height:24px}
.foot{background:var(--card);border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;gap:10px}
.foot>*{flex:1}
.pad{padding:0 16px}
.h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px}
.muted{color:var(--muted)}
.s12{font-size:12px}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}
.b{font-weight:600}.bb{font-weight:700}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative;flex:none;color:var(--fg)}
.ib svg{width:22px;height:22px}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;flex:none;position:relative}
.dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--down);border:2px solid var(--surface)}
.ii{width:32px;height:32px;margin:-8px -4px;border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;vertical-align:middle}
.ii svg{width:17px;height:17px}
.top{display:flex;align-items:center;gap:6px;padding:10px 10px 4px;position:sticky;top:0;background:var(--surface);z-index:2}
.top h1{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{margin:22px 16px 0;display:flex;flex-direction:column;gap:10px}
.h2{margin:0;font-size:17px;font-weight:700}
.btn{height:46px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:19px;height:19px}
.btn.sm{height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.pri:hover{background:var(--accent-hover)}
.btn.full{width:100%;height:54px;font-size:17px}
.btn.danger{color:var(--down)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0;min-height:32px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--chip);color:var(--chip-fg);white-space:nowrap}
.chip.low{background:var(--ok-bg);color:var(--ok-fg)}
.chip.mod{background:var(--warn-bg);color:var(--warn-fg)}
.chip.vhi{background:var(--vhi-bg);color:var(--vhi-fg)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--warn-bg);color:var(--warn-fg);font-size:13px;font-weight:600;border:0;white-space:nowrap}
.pill svg{width:15px;height:15px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;border-top:1px solid var(--line2);text-align:left;min-height:58px}
.item:first-child{border-top:0}
.grow{flex:1;min-width:0}
.item .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right;flex:none}
.lic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.lic svg{width:20px;height:20px}
.lic.warn{background:var(--warn-bg);color:var(--warn-fg)}
.lic.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.kv.sep{border-top:1px solid var(--line2);padding-top:10px}
.big{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.spark svg{display:block;width:100%;height:auto}
.cashbar{display:flex;align-items:center;gap:8px;margin:14px 16px 0}
.cashbar .grow{display:flex;flex-direction:column}
.insight{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 14px;border-radius:16px;background:var(--accent-soft);color:var(--fg);border:0;width:calc(100% - 32px);text-align:left}
.insight .lic{background:var(--card)}
.qchips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.qchips button{flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.qchips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.qchips svg{width:16px;height:16px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;height:50px;padding:0 14px;color:var(--muted)}
.search svg{width:20px;height:20px;flex:none}
.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--fg)}
.mkt{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mkt>div{display:flex;flex-direction:column}
.score{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.rd{display:inline-flex;gap:3px;align-items:center}
.rd i{width:7px;height:7px;border-radius:50%;display:block;background:var(--line)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.mix i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.leg span{display:flex;align-items:center;gap:6px}
.leg b{width:9px;height:9px;border-radius:2px;display:inline-block}
.check{display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 0;border-top:1px solid var(--line2)}
.check:first-of-type{border-top:0}
.check .mk{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.check .mk svg{width:14px;height:14px}
.mk.yes{background:var(--ok-bg);color:var(--up)}.mk.no{background:var(--hi-bg);color:var(--down)}.mk.na{background:var(--chip);color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;font-size:13px;font-weight:600;min-width:44px;height:34px;padding:0 10px;color:var(--chip-fg)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 2px var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.qty{display:flex;align-items:center;justify-content:center;gap:18px}
.qty button{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:600;color:var(--accent);flex:none}
.qty input{width:120px;height:62px;border:0;border-bottom:2px solid var(--accent);background:transparent;text-align:center;font-size:40px;font-weight:700;color:var(--fg);border-radius:0;padding:0}
details.tot summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:4px 0}
details.tot summary::-webkit-details-marker{display:none}
details.tot summary .chev{transform:rotate(90deg);transition:transform .15s}
details.tot[open] summary .chev{transform:rotate(-90deg)}
details.tot .rows{padding-top:8px;display:flex;flex-direction:column;gap:6px}
.slide{position:relative;height:60px;border-radius:30px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;user-select:none;touch-action:none;overflow:hidden}
.slide.sell{background:var(--down)}
.slide .lbl{padding-left:40px;opacity:.95}
.slide .knob{position:absolute;left:5px;top:5px;width:50px;height:50px;border-radius:50%;border:0;background:var(--card);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:grab;box-shadow:0 2px 6px var(--shadow)}
.slide.sell .knob{color:var(--down)}
.slide .knob svg{width:24px;height:24px}
.slide.nudge .knob{animation:nudge .5s ease}
@keyframes nudge{40%{transform:translateX(26px)}}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .nd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.tl .nd svg{width:13px;height:13px}
.tl .nd.done{background:var(--up);border-color:var(--up);color:var(--card)}
.tl .nd.now{border-color:var(--accent);background:var(--accent-soft)}
.tl .nd.x{background:var(--muted);border-color:var(--muted);color:var(--card)}
.tl .ln{width:2px;flex:1;min-height:18px;background:var(--line)}
.tl .ln.done{background:var(--up)}
.tl .tx{padding-bottom:12px}
.tl .tx .t{font-size:15px;font-weight:600}
.tl .tx .d{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;min-height:64px}
.opt .lic{width:42px;height:42px}
.opt .t{font-size:16px;font-weight:700}.opt .d{font-size:13px;color:var(--muted)}
.prog{display:flex;gap:6px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--accent)}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;font-weight:600}
.tile .lic{width:46px;height:46px}
.empty{text-align:center;padding:24px 16px;color:var(--muted);font-size:14px;line-height:1.5}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px 20px;display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 0;flex:none}
.sheet h2{margin:0;font-size:21px;font-weight:700}
.sheet p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:absolute;left:14px;right:14px;bottom:80px;z-index:30;background:var(--card);color:var(--fg);border:1px solid var(--line);border-left:4px solid var(--up);border-radius:12px;padding:6px 8px 6px 14px;min-height:48px;font-size:14px;font-weight:600;box-shadow:0 10px 30px -10px var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;min-height:40px;padding:0 10px}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 2px;margin:18px 8px 0}
.acts button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg);padding:2px 0;line-height:1.2;text-align:center}
.acts .ic{width:50px;height:50px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.acts .ic svg{width:24px;height:24px}
.acts .ic.hl{background:var(--accent-soft);border-color:var(--accent-soft)}
.otp{display:flex;gap:8px;justify-content:center}
.otp span{width:42px;height:52px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:var(--card)}
.tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);border-radius:1px}
.cols{display:flex;gap:14px;align-items:flex-end;height:90px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.cols i{display:block;width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:var(--c5)}
.cols .on i{background:var(--accent)}
/* presenter column */
.panel{flex:1 1 280px;max-width:340px;min-width:0;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.panel h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
.panel .lede{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pbox h2{margin:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.now{font-size:15px;font-weight:600;margin:0;line-height:1.45}
.tries{display:flex;flex-direction:column}
.tries button{border:0;background:none;text-align:left;padding:9px 0;font-size:14px;font-weight:600;color:var(--accent);border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px}
.tries button:first-child{border-top:0}
.tries span{color:var(--muted);font-weight:500;white-space:nowrap}
.fine{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
@media (max-width:520px){
  .stage{padding-inline:0;padding-block:0 24px;gap:20px}
  .phone{width:100%;border:0;border-radius:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px}
  .panel{padding-inline:16px;max-width:none}
}
@media (prefers-reduced-motion: reduce){.sheet,.slide.nudge .knob{animation:none}.scr{scroll-behavior:auto}.switch::after,details.tot summary .chev{transition:none}}
</style>
</head>
<body>


<div class="stage">
  <div class="phone" aria-label="Kosh app prototype">
    <div class="scr" id="scr"></div>
    <div class="foot" id="foot" hidden></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div id="sheetHost"></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <aside class="panel" aria-label="About this prototype">
    <h1>Kosh</h1>
    <p class="lede">Four tabs, each thing in one place. Icons with one word, defaults instead of questions, and insights that tell you what to do next.</p>
    <div class="pbox">
      <h2>Demo account</h2>
      <div class="seg" role="group" aria-label="User" id="modes" style="display:grid;grid-template-columns:1fr 1fr">
        <button data-a="mode" data-v="new">New investor</button><button data-a="mode" data-v="investor">Has a portfolio</button>
      </div>
      <p class="fine">There is no switch in the app. Home changes by itself as you invest.</p>
    </div>

const sinr=(n,d=0)=>(n>=0?'+':'−')+'₹'+num(n,d);
const sp=(p,d=2)=>`<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(d)}%</span>`;
const spx=p=>`${p>=0?'+':'−'}${Math.abs(p).toFixed(1)}%`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dateL=s=>{try{return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}catch(e){return s}};

/* ---------- intelligence: Buffett-style checks ---------- */
function checks(s){
  const c=[];
  c.push({l:'Return on equity',v:s.roe==null?'—':s.roe.toFixed(0)+'%',ok:s.roe==null?null:s.roe>=15});
  c.push(s.fin?{l:'Debt',v:'Lender',ok:null}:{l:'Debt to equity',v:s.de==null?'—':s.de.toFixed(1)+'×',ok:s.de==null?null:s.de<=0.5});
  c.push({l:'Profit margin',v:s.npm==null?'—':s.npm.toFixed(0)+'%',ok:s.npm==null?null:s.npm>=10});
  c.push({l:'Profit growth',v:s.eg==null?'—':spx(s.eg),ok:s.eg==null?null:s.eg>=10});
  c.push({l:'Price to earnings',v:s.pe==null?'—':s.pe.toFixed(0)+'×',ok:s.pe==null?null:s.pe>0&&s.pe<=25});
  return c;
}
function score(s){const c=checks(s).filter(x=>x.ok!==null);const p=c.filter(x=>x.ok).length;return {p,n:c.length,f:c.length?p/c.length:0}}
const scoreUI=s=>{const sc=score(s);const col=sc.f>=.99?'var(--up)':sc.f>=.75?'var(--c4)':'var(--muted)';return `<span class="score" aria-label="${sc.p} of ${sc.n} checks"><span class="rd">${Array.from({length:sc.n},(_,i)=>`<i style="background:${i<sc.p?col:'var(--line)'}"></i>`).join('')}</span>${sc.p}/${sc.n}</span>`};
function quality(){return D.stocks.map(s=>({s,sc:score(s)})).filter(x=>x.sc.f>=0.75).sort((a,b)=>b.sc.f-a.sc.f||b.s.roe-a.s.roe).map(x=>x.s)}

/* ---------- state ---------- */
let S={};
function init(mode){
  S={mode,tab:'home',stack:[],sheet:null,lang:'en',ts:1,simple:true,xsec:'quality',mover:'up',range:'1Y',period:'3Y',q:'',oid:10,plan:null,pa:{},
    watch:['ITC','HDFCBANK','TCS','TITAN'],orders:[],sips:[],bids:{},fds:[],ssips:[],aa:false,pick:null};
  if(mode==='investor'){
    Object.assign(S,{cash:19840,
      stocks:[{s:'ICICIBANK',q:20,avg:1180},{s:'ITC',q:60,avg:240},{s:'INFY',q:12,avg:1100}],
      funds:[{id:'flexi',val:47300,inv:41000},{id:'n50',val:2400,inv:2000}],
      sips:[{id:'flexi',amt:2000,day:10}],bids:{rk:{st:'mandate',lots:1}}});
    S.orders=[{id:3,type:'ipo',ipo:'rk',st:'mandate',when:'Today, 1:10 AM'},{id:2,type:'sip',fund:'flexi',amt:2000,day:10,st:'active'},
      {id:1,type:'stock',side:'buy',sym:'ICICIBANK',q:5,price:1310.60,total:6579.15,st:'done',when:'3 Oct, 10:42 AM'}];
  } else Object.assign(S,{cash:0,stocks:[],funds:[]});
}
const held=s=>S.stocks.find(h=>h.s===s);
function port(){
  let sv=0,si=0,sd=0;S.stocks.forEach(h=>{const k=BY[h.s];sv+=h.q*k.p;si+=h.q*h.avg;sd+=h.q*k.c});
  let fv=0,fi=0;S.funds.forEach(f=>{fv+=f.val;fi+=f.inv});let dv=0;S.fds.forEach(x=>dv+=x.amt);
  const fd=fv*NIFTY().cp/100*0.9;
  return {sv,fv,dv,inv:si+fi+dv,val:sv+fv+dv,ret:sv+fv-si-fi,day:sd+fd,total:sv+fv+dv+S.cash};
}
function series(){
  const n=NIFTY().w.length,out=[];
  for(let i=0;i<n;i++){let v=S.cash+S.fds.reduce((a,b)=>a+b.amt,0);S.stocks.forEach(h=>{const w=BY[h.s].w;v+=h.q*(w[w.length-n+i]??w[0])});S.funds.forEach(f=>{const nw=NIFTY().w;v+=f.val*nw[i]/nw[n-1]});out.push(v)}
  return out;
}

/* ---------- intelligence: portfolio insights ---------- */
function doing(){
  const p=port();if(!S.stocks.length)return null;
  let w=0,r=0;const rows=S.stocks.map(h=>{const k=BY[h.s],v=h.q*k.p;w+=v;r+=v*k.r1;return {h,k,v,pl:h.q*(k.p-h.avg),plp:(k.p/h.avg-1)*100}});
  rows.sort((a,b)=>b.k.r1-a.k.r1);
  const good=rows.filter(x=>score(x.k).f>=0.75).length;
  return {r1:r/w,n1:NIFTY().r1,best:rows[0],worst:rows[rows.length-1],good,n:rows.length,rows,sv:p.sv};
}
function alerts(){
  const out=[],p=port();
  if(S.stocks.length){
    const sv=p.sv,top=S.stocks.map(h=>({s:h.s,v:h.q*BY[h.s].p})).sort((a,b)=>b.v-a.v)[0];
    if(top.v/sv>0.35)out.push({ic:'pie',t:`${top.s} is ${Math.round(top.v/sv*100)}% of your stocks`,d:'One stock carries most of your risk',btn:'Spread out',a:'jump',v:'gaps'});
    const sec={};S.stocks.forEach(h=>{const k=BY[h.s];sec[k.sec]=(sec[k.sec]||0)+h.q*k.p});
    const ts=Object.entries(sec).sort((a,b)=>b[1]-a[1])[0];
    if(ts[1]/sv>0.45&&ts[0]!==BY[top.s].sec)out.push({ic:'pie',t:`${ts[0]} are ${Math.round(ts[1]/sv*100)}% of your stocks`,d:'Add other sectors',btn:'See ideas',a:'jump',v:'gaps'});
    S.stocks.forEach(h=>{const k=BY[h.s];if(k.r1-NIFTY().r1<-12)out.push({ic:'fall',t:`${h.s} ${spx(k.r1)} in a year`,d:`NIFTY 50 ${spx(NIFTY().r1)} · passes ${score(k).p}/${score(k).n} checks`,btn:'Review',a:'go',v:'stock:'+h.s})});
  }
  if(p.total>0&&S.cash/p.total>0.1)out.push({ic:'wallet',t:`${inr(S.cash,0)} cash is idle`,d:`${Math.round(S.cash/p.total*100)}% of your money earns nothing`,btn:'Put to work',a:'fund',v:'liquid'});
  if(!S.plan)out.push({ic:'sparkle',t:'Set your ideal mix',d:'3 quick taps',btn:'Start',a:'plan',v:''});
  return out.slice(0,4);
}
function gaps(){
  const hs=new Set(S.stocks.map(h=>BY[h.s].sec));
  return quality().filter(s=>!held(s.s)&&!hs.has(s.sec)).filter((s,i,a)=>a.findIndex(x=>x.sec===s.sec)===i).slice(0,3);
}

/* ---------- intelligence: ideal portfolio ---------- */
const QS=[
  {k:'age',q:'How old are you?',ic:'cake',o:[['20s','Under 30'],['30s','30 to 39'],['40s','40 to 49'],['50+','50 or more']]},
  {k:'hz',q:'When will you need this money?',ic:'hour',o:[['short','Within 3 years'],['mid','In 3 to 7 years'],['long','After 7 years']]},
  {k:'risk',q:'Your investments fall 20%. You…',ic:'heart',o:[['sell','Sell to stop the loss'],['wait','Wait it out'],['buy','Buy more']]}

function ideal(a){
  let eq={short:20,mid:50,long:70}[a.hz]+{sell:-15,wait:0,buy:10}[a.risk]+{'20s':5,'30s':0,'40s':-5,'50+':-10}[a.age];
  eq=Math.max(10,Math.min(85,eq));const gold=10,debt=100-eq-gold;
  return [{k:'idx',l:'Index funds',v:Math.round(eq*0.7),c:'var(--c1)'},{k:'stk',l:'Quality stocks',v:eq-Math.round(eq*0.7),c:'var(--c2)'},{k:'debt',l:'Debt funds',v:debt,c:'var(--c3)'},{k:'gold',l:'Gold',v:gold,c:'var(--c4)'}];
}
function current(){
  const p=port();if(!p.total)return null;
  const b={idx:0,stk:p.sv,debt:p.dv,gold:0,cash:S.cash};S.funds.forEach(f=>{const c=FUND[f.id].cls;b[c==='eq'?'idx':c]+=f.val});
  const t=p.total;return [{k:'idx',l:'Index & equity funds',v:b.idx/t*100,c:'var(--c1)'},{k:'stk',l:'Stocks',v:b.stk/t*100,c:'var(--c2)'},{k:'debt',l:'Debt',v:b.debt/t*100,c:'var(--c3)'},{k:'gold',l:'Gold',v:b.gold/t*100,c:'var(--c4)'},{k:'cash',l:'Cash',v:b.cash/t*100,c:'var(--c5)'}];
}

const mixLeg=(m)=>`<div class="leg">${m.filter(x=>x.v>0.4).map(x=>`<span><b style="background:${x.c}"></b>${x.l} ${Math.round(x.v)}%</span>`).join('')}</div>`;

/* ---------- shared UI ---------- */
function ist(){return new Date(Date.now()+(330+new Date().getTimezoneOffset())*60000)}
function mkt(){const n=ist(),d=n.getDay(),m=n.getHours()*60+n.getMinutes(),wk=d>0&&d<6;if(wk&&m>=555&&m<930)return {open:true};return {open:false,next:wk&&m<555?'':(d===5||d===6)?'Mon ':'tomorrow '}}
function todayIST(){const n=ist();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
const closed=(k)=>{const m=mkt();if(m.open){const live=D.asOf===todayIST()&&D.asOfTime;return `<button class="pill" data-a="info" data-v="open" style="background:var(--ok-bg);color:var(--ok-fg)">${I.clock}${k==='send'?'Sends now':live?'Open · prices '+D.asOfTime:'Market open'}</button>`}
  return `<button class="pill" data-a="info" data-v="closed">${I.clock}${k==='send'?'Sends '+m.next+'9:15 AM':k==='short'?'Closed':'Closed · opens '+m.next+'9:15'}</button>`};
const stockRow=(s,right)=>{const k=BY[s];return `<button class="item" data-a="go" data-v="stock:${s}"><div class="grow"><div class="t">${s}</div><div class="d">${esc(k.n)}</div></div><div class="r">${right==='score'?scoreUI(k)+'<div class="s12" style="margin-top:3px">'+sp(k.cp)+'</div>':`<div class="s15 b">${inr(k.p)}</div><div class="s12">${sp(k.cp)}</div>`}</div></button>`};
const fundRow=(id,right)=>{const f=FUND[id];return `<button class="item" data-a="fund" data-v="${id}"><span class="lic">${I[f.ic]}</span><div class="grow"><div class="t">${f.n}</div><div class="d">${f.r['3Y']}% a year (3Y) · fee ${f.er}%</div></div>${right||chevI}</button>`};
function sparkSvg(v,h,label){
  const W=340,H=h||90,P=4,mn=Math.min(...v),mx=Math.max(...v),sx=(W-2*P)/(v.length-1),sy=y=>P+(H-2*P)*(1-(y-mn)/((mx-mn)||1));
  const pts=v.map((y,i)=>`${(P+i*sx).toFixed(1)},${sy(y).toFixed(1)}`),up=v[v.length-1]>=v[0],col=up?'var(--up)':'var(--down)',l=pts[pts.length-1].split(',');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}"><path d="M${pts[0]} L${pts.join(' L')} L${(P+(v.length-1)*sx).toFixed(1)},${H} L${P},${H} Z" fill="${col}" opacity=".1"/><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="4" fill="${col}"/></svg>`;
}

function updTrade(){

   <div class="rows s13"><div class="kv"><span>${q} × ${inr(pr)}</span><span>${inr(v)}</span></div><div class="kv muted"><span>Brokerage</span><span>${inr(brok)}</span></div><div class="kv muted"><span>STT</span><span>${inr(stt)}</span></div><div class="kv muted"><span>Exchange, SEBI, GST</span><span>${inr(ex+gst)}</span></div>${buy?`<div class="kv muted"><span>Stamp duty</span><span>${inr(stamp)}</span></div>`:`<div class="kv muted"><span>Depository</span><span>${inr(dp)}</span></div>`}</div></details>
   <div class="kv sep s13 muted"><span>${buy?'Cash after':'Profit on these'}</span><span class="b" style="color:var(--fg)">${buy?inr(S.cash-net):sinr(q*(pr-(h?h.avg:pr))-ch)}</span></div>`;
  tk.net=net;tk.qn=q;tk.pr=pr;
  const go=document.getElementById('tk-go');
  let err=q<1?'Choose how many':pr<=0?'Enter a price':(!buy&&(!h||q>h.q))?`You own ${h?h.q:0}`:'';

  go.innerHTML=`<div class="slide ${buy?'':'sell'}" id="slide"><span class="lbl">Slide to ${buy?'buy':'sell'}</span><button class="knob" id="knob" aria-label="${buy?'Buy':'Sell'} ${q} ${tk.sym} for ${inr(net)}. Press Enter to confirm.">${I.arrow}</button></div>`;
  bindSlide();
}
function bindSlide(){
  const sl=document.getElementById('slide'),kn=document.getElementById('knob');if(!sl)return;
  let x0=null,dx=0;const max=()=>sl.clientWidth-60;
  kn.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;kn.setPointerCapture(e.pointerId);kn.style.transition='none'});
  kn.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.max(0,Math.min(max(),e.clientX-x0));kn.style.transform=`translateX(${dx}px)`});
  const end=()=>{if(x0===null)return;x0=null;if(dx>max()*0.82){kn.style.transform=`translateX(${max()}px)`;A.place()}else{kn.style.transition='transform .2s';kn.style.transform='';if(dx<6){sl.classList.remove('nudge');void sl.offsetWidth;sl.classList.add('nudge')}}};
  kn.addEventListener('pointerup',end);kn.addEventListener('pointercancel',end);
  kn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();A.place()}});
}

SH.fees=()=>`<h2>Fees paid · ${inr(S.mode==='new'?0:1284,0)}</h2><p>1 Apr – 5 Oct 2026. Account fee ₹0.</p>${S.mode==='new'?'':`<div class="card stack s14"><div class="kv"><span>Brokerage (14 orders)</span><span>₹280</span></div><div class="kv"><span>STT</span><span>₹612</span></div><div class="kv"><span>Exchange, SEBI, GST</span><span>₹119</span></div><div class="kv"><span>Stamp duty</span><span>₹90</span></div><div class="kv"><span>Depository</span><span>₹183</span></div></div>`}<button class="btn full" data-a="close">Close</button>`;
SH.call=()=>`<h2>Call us</h2><div class="card" style="font-size:26px;font-weight:700;text-align:center;user-select:all">1800 000 0000</div><p style="text-align:center">Sample number · 8 AM–10 PM daily</p><button class="btn full" data-a="close">Close</button>`;
SH.chat=()=>`<h2>Chat</h2><div class="card stack"><span class="s12 muted">Ritu · Kosh support · a person</span><span class="s15">Hi, how can I help?</span></div><div class="chips"><button data-a="toast" data-v="Ritu would reply here">Order issue</button><button data-a="toast" data-v="Ritu would reply here">IPO mandate</button><button data-a="toast" data-v="Ritu would reply here">Withdrawal</button></div>`;
SH.complaint=()=>`<h2>Raise a complaint</h2><p>Reply in 24 hours. Not resolved? We’ll help you take it to SEBI SCORES.</p><input aria-label="What went wrong" placeholder="What went wrong?" style="height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:15px"><button class="btn full pri" data-a="toast" data-v="Complaint KS-7731 logged">Submit</button>`;
SH.fno=()=>`<h2>Before futures &amp; options</h2><div class="card stack"><div class="big down" style="font-size:28px">9 in 10</div><span class="s14">individual F&amp;O traders lost money (SEBI study). Average loss about ₹50,000, plus 28% more in costs.</span></div><label class="check" style="border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)"><input type="checkbox" data-in="fnochk" style="width:22px;height:22px;accent-color:var(--accent)"><span class="s14">I understand I can lose all the money I trade with, and more if I sell options.</span></label><button class="btn full pri" id="fno-go" data-a="toast" data-v="Option chain is not part of this demo" disabled>Continue</button>`;

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
function cur(){return S.stack.length?S.stack[S.stack.length-1]:{s:S.tab}}
function render(reset){
  const c=cur(),scr=$('scr'),y=scr.scrollTop,r=SC[c.s](c);
  document.documentElement.style.setProperty('--ts',S.ts);
  scr.innerHTML=`<div class="zoom">${r.body}</div>`;
  $('foot').innerHTML=r.foot||'';$('foot').hidden=!r.foot;
  $('nav').hidden=!r.nav;
  const L=T[S.lang];$('nav').innerHTML=[['home',I.home],['explore',I.explore],['insights',I.sparkle],['activity',I.act]].map(([k,ic])=>`<button data-a="tab" data-v="${k}" ${S.tab===k&&!S.stack.length?'aria-current="page"':''}>${ic}${L[k]}${k==='activity'&&S.orders.some(o=>['queued','mandate'].includes(o.st))?'':''}</button>`).join('');
  scr.scrollTop=reset?0:y;
  renderSheet();
  $('now').textContent=S.sheet?($('now').dataset.sheet||r.now):r.now;
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.mode));
  $('src').textContent=D.source==='live'?`Prices and fundamentals: NSE data from ${dateL(D.asOf)}${D.asOfTime?', '+D.asOfTime+' IST':''}, via Yahoo Finance. Refreshed every 30 minutes while the market is open. Funds and IPOs are sample data.`:`Showing a sample market snapshot. When hosted on GitHub, a daily job replaces it with NSE closing prices and fundamentals. Funds and IPOs are sample data.`;
}
const SHN={pick:'SIP or lump sum in one sheet: switch type, pick a fund, pick an amount, start. Two taps from Home.',ssip:'Stock SIP: pick a stock, amount and date. Buys whole shares every month.',buyq:'Buy straight from Home: search, tap, slide. No stock page in between.',fd:'FD: bank, tenure, amount, and the exact amount you get back.',refer:'Refer: one code, copy or WhatsApp, and what you have earned.',aa:'Account Aggregator consent: read-only, RBI-licensed, revocable. Three steps.',ipos:'Open IPOs, all flagged SME, with the real minimum.',trade:'One sheet: how many, the total with charges folded in, then slide to confirm. Undo appears right after.',fund:'Fund and SIP are one sheet: returns against similar funds and the index, then amount, date, start.',plan:'Ideal portfolio: three questions, one tap each, no Next buttons. Then one tap starts the SIPs.',ipo:'IPO: the one number that matters, what you need at the top of the band.',add:'Add money: amount, one button.'};
function renderSheet(){
  const h=$('sheetHost');if(!S.sheet){h.innerHTML='';return}
  const i=S.sheet.indexOf(':'),k=i<0?S.sheet:S.sheet.slice(0,i),arg=i<0?'':S.sheet.slice(i+1);
  h.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${SH[k](arg)}</div></div>`;
  if(SHN[k])$('now').textContent=SHN[k];
  if(k==='trade')updTrade();
}
let tt;function toast(m,act){const e=$('toast');e.innerHTML=`<span>${m}</span>${act?`<button data-a="${act.a}" data-v="${act.v}">${act.l}</button>`:''}`;e.style.bottom=(!$('foot').hidden?$('foot').offsetHeight+10:!$('nav').hidden?$('nav').offsetHeight+10:16)+'px';e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,act?6000:2600)}
function go(s,p){S.sheet=null;S.stack.push({s,p});render(true)}
function sheet(v){S.sheet=v;if(v)$('toast').hidden=true;renderSheet()}
function jump(id){if(S.tab!=='insights'||S.stack.length){S.tab='insights';S.stack=[];S.sheet=null;render(true)}const el=$('j-'+id);if(el)$('scr').scrollTo({top:el.offsetTop-8,behavior:'smooth'})}

/* ---------- actions ---------- */
const A={
  tab:v=>{S.tab=v;S.stack=[];S.sheet=null;render(true)},
  back:()=>{S.stack.pop();S.sheet=null;render(true)},
  go:v=>{const i=v.indexOf(':');go(i<0?v:v.slice(0,i),i<0?undefined:v.slice(i+1))},
  sheet:v=>sheet(v),
  close:()=>sheet(null),
  scrim:(v,el,e)=>{if(e.target===el)sheet(null)},
  info:v=>sheet('info:'+v),
  toast:v=>{sheet(null);toast(v)},
  jump:v=>jump(v),
  xsec:v=>{S.xsec=v;render()},
  xgo:v=>{S.tab='explore';S.xsec=v;S.q='';S.stack=[];render(true)},
  mover:v=>{S.mover=v;render()},
  range:v=>{S.range=v;render()},
  star:v=>{const i=S.watch.indexOf(v);if(i>=0){S.watch.splice(i,1);toast('Stopped watching '+v)}else{S.watch.push(v);toast('Watching '+v)}render()},
  trade:v=>{const [s,side]=v.split('|'),h=held(s);S.tk={sym:s,side,q:side==='sell'&&h?h.q:1,price:BY[s].p.toFixed(2),lim:false};sheet('trade')},
  tq:v=>{S.tk.q=Math.max(1,(parseInt(S.tk.q)||0)+ +v);$('tq').value=S.tk.q;document.querySelectorAll('[data-a="tqs"]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===S.tk.q));updTrade()},
  tqs:v=>{S.tk.q=+v;$('tq').value=v;document.querySelectorAll('[data-a="tqs"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));updTrade()},
  lim:()=>{S.tk.lim=true;renderSheet()},
  addfor:v=>{S.amt=+v;S.after='trade';sheet('add')},
  place:()=>{const tk=S.tk;if(tk.cid){const o=S.orders.find(x=>x.id===tk.cid);if(o.side==='buy')S.cash+=o.total;S.orders=S.orders.filter(x=>x!==o)}
    const id=++S.oid;S.orders.unshift({id,type:'stock',side:tk.side,sym:tk.sym,q:tk.qn,price:tk.pr,total:tk.net,st:'queued',when:'Just now'});if(tk.side==='buy')S.cash-=tk.net;
    S.sheet=null;render();toast(`${tk.side==='buy'?'Buy':'Sell'} order placed · ${tk.qn} ${tk.sym}`,{a:'undo',v:id,l:'Undo'})},
  undo:v=>{const o=S.orders.find(x=>x.id===+v);if(!o)return;S.orders=S.orders.filter(x=>x!==o);if(o.side==='buy')S.cash+=o.total;render();toast('Undone. Nothing was sent.')},
  cancel:v=>{const o=S.orders.find(x=>x.id===+v);o.st='cancelled';if(o.side==='buy')S.cash+=o.total;sheet(null);render();toast('Cancelled. No charge.')},
  change:v=>{const o=S.orders.find(x=>x.id===+v);S.tk={sym:o.sym,side:o.side,q:o.q,price:o.price.toFixed(2),lim:true,cid:o.id};sheet('trade')},
  amt:v=>{S.amt=+v;renderSheet()},
  doadd:()=>{const a=+(S.amt||5000)||0;if(a<=0)return;S.cash+=a;S.amt=0;const after=S.after;S.after=null;render();if(after==='trade'){sheet('trade');toast(`${inr(a,0)} added. Now slide to buy.`)}else{sheet(null);toast(`${inr(a,0)} added`)}},
  dowd:()=>{const v=Math.min(S.cash,Math.max(0,+($('wd').value)||0));S.cash-=v;sheet(null);render();toast(`${inr(v,0)} on its way to your bank`)},
  fund:v=>{S.famt=0;S.fday=10;sheet('fund:'+v)},
  period:v=>{S.period=v;renderSheet()},
  famt:v=>{S.famt=+v;renderSheet()},
  fday:v=>{S.fday=+v;renderSheet()},
  dosip:v=>{const f=FUND[v],amt=S.famt&&S.famt>=f.min?S.famt:f.min,day=S.fday||10;addSip(v,amt,day);sheet(null);render();toast(`SIP started · ${inr(amt,0)} on the ${day}th`,{a:'undosip',v,l:'Undo'})},
  undosip:v=>{S.sips=S.sips.filter(x=>x.id!==v);S.orders=S.orders.filter(o=>!(o.type==='sip'&&o.fund===v&&o.fresh));render();toast('SIP removed')},
  stopsip:v=>{S.sips=S.sips.filter(x=>x.id!==v);S.orders.forEach(o=>{if(o.type==='sip'&&o.fund===v)o.st='cancelled'});sheet(null);render();toast('SIP stopped. No charge.')},
  ipo:v=>{S.lots=1;sheet('ipo:'+v)},
  lots:v=>{S.lots=Math.max(1,Math.min(5,(S.lots||1)+ +v));renderSheet()},
  bid:v=>{S.bids[v]={st:'mandate',lots:S.lots||1};S.orders.unshift({id:++S.oid,type:'ipo',ipo:v,st:'mandate',when:'Today'});renderSheet();render()},
  approve:v=>{S.bids[v].st='applied';S.orders.forEach(o=>{if(o.type==='ipo'&&o.ipo===v)o.st='applied'});sheet(null);render();toast('Approved. Your bid is in.')},
  plan:()=>{S.pstep=0;S.pa=S.plan?{...S.plan}:{};sheet('plan')},
  pans:v=>{const [k,x]=v.split('|');S.pa[k]=x;S.pstep=(S.pstep||0)+1;renderSheet()},
  pback:()=>{S.pstep=Math.max(0,S.pstep-1);renderSheet()},
  pamt:v=>{S.pamt=+v;renderSheet()},
  planact:()=>{if(!S.plan&&!S.pa.risk){A.plan();return}S.plan={...(S.pa.risk?S.pa:S.plan)};const sp=planSplit(ideal(S.plan),S.pamt||5000);sp.forEach(x=>addSip(x.id,x.a,10));sheet(null);S.tab='activity';S.stack=[];render(true);toast(`${sp.length} SIPs started · ${inr(sp.reduce((a,b)=>a+b.a,0),0)}/mo`)},
  act:v=>{$('toast').hidden=true;
    if(v==='sip'){S.pick={mode:'sip',id:'n50'};sheet('pick')}
    if(v==='lump'){S.pick={mode:'lump',id:'n50'};sheet('pick')}
    if(v==='liquid'){S.pick={mode:'lump',id:'liquid'};sheet('pick')}
    if(v==='ssip'){S.ss={sym:(S.stocks[0]||quality()[0]).s,amt:2000,day:10};sheet('ssip')}
    if(v==='buy')sheet('buyq');
    if(v==='ipos')sheet('ipos');
    if(v==='fd'){S.fdx={bank:0,ten:1,amt:50000};sheet('fd')}
    if(v==='money'){if(S.aa)go('money');else{S.aastep=0;sheet('aa')}}
    if(v==='ins'){S.tab='insights';S.stack=[];S.sheet=null;render(true)}
    if(v==='refer')sheet('refer');
  },
  pmode:v=>{S.pick.mode=v;S.pick.amt=0;renderSheet()},
  pfund:v=>{S.pick.id=v;S.pick.amt=0;renderSheet()},
  pamt2:v=>{S.pick.amt=+v;renderSheet()},
  pday:v=>{S.pick.day=+v;renderSheet()},
  pgo:()=>{const P=S.pick,f=FUND[P.id],sip=P.mode==='sip',amt=P.amt&&P.amt>=f.min?P.amt:(sip?f.min:Math.max(f.min,5000)),day=P.day||10;
    if(sip){addSip(P.id,amt,day);sheet(null);render();toast(`SIP started · ${inr(amt,0)} on the ${day}th`,{a:'undosip',v:P.id,l:'Undo'});return}
    const fc=Math.min(S.cash,amt);S.cash-=fc;let h=S.funds.find(x=>x.id===P.id);if(!h){h={id:P.id,val:0,inv:0};S.funds.push(h)}h.val+=amt;h.inv+=amt;delete h.pending;
    S.orders.unshift({id:++S.oid,type:'lump',fund:P.id,amt,st:'queued',when:'Today'});sheet(null);render();toast(`${inr(amt,0)} invested in ${f.s}`)},
  ssym:v=>{S.ss.sym=v;renderSheet()},samt:v=>{S.ss.amt=+v;renderSheet()},sday:v=>{S.ss.day=+v;renderSheet()},
  sgo:()=>{const X=S.ss;S.ssips=S.ssips.filter(x=>x.sym!==X.sym);S.ssips.push({...X});S.orders.unshift({id:++S.oid,type:'ssip',sym:X.sym,amt:X.amt,day:X.day,st:'active'});sheet(null);render();toast(`Stock SIP started · ${X.sym} ${inr(X.amt,0)}/mo`)},
  fdb:v=>{S.fdx.bank=+v;renderSheet()},fdt:v=>{S.fdx.ten=+v;renderSheet()},fda:v=>{S.fdx.amt=+v;renderSheet()},
  fdgo:()=>{const X=S.fdx,b=FDS[X.bank],r=b.r[X.ten],mat=X.amt*Math.pow(1+r/400,4*X.ten);S.fds.push({bank:b.b.replace('Sample ',''),rate:r,ten:X.ten,amt:X.amt,mat});S.orders.unshift({id:++S.oid,type:'fd',bank:b.b.replace('Sample ',''),rate:r,ten:X.ten,amt:X.amt,st:'active'});sheet(null);render();toast(`FD booked · ${inr(X.amt,0)} at ${r}%`)},
  copy:v=>{const d=document.createElement('textarea');d.innerHTML=v;const t=d.value;try{navigator.clipboard.writeText(t).then(()=>toast('Invite copied'),()=>toast('Code: KOSH7Q2F'))}catch(e){toast('Code: KOSH7Q2F')}},
  aanext:()=>{S.aastep=(S.aastep||0)+1;renderSheet()},
  aapick:v=>{S.aaName=v;S.aastep=2;renderSheet()},
  aadone:()=>{S.aa=true;S.sheet=null;go('money');toast('Bank linked. Revoke any time in your profile.')},
  revoke:()=>{S.aa=false;render();toast('Consent revoked. Your bank data is deleted.')},
  mon:v=>{S.mon=v;render()},
  mact:v=>{const [k,a]=v.split('|');S.pick=k==='sip'?{mode:'sip',id:'n50',amt:+a}:{mode:'lump',id:'liquid',amt:+a};sheet('pick')},
  simple:()=>{S.simple=!S.simple;render();toast(S.simple?'Simple view on':'Futures & options now in your profile')},
  lang:v=>{S.lang=v;render()},
  mode:v=>{init(v);render(true)},
  restart:()=>{init(S.mode);render(true)},
  try:v=>{
    S.sheet=null;$('toast').hidden=true;
    if(v==='doing'){if(S.mode==='new')init('investor');S.tab='insights';S.stack=[];render(true);return}
    if(v==='plan'){S.tab='insights';S.stack=[];render(true);A.plan();return}
    S.tab='home';S.stack=[];render(true);A.act(v);
  }
};
function addSip(id,amt,day){if(!S.funds.find(x=>x.id===id))S.funds.push({id,val:0,inv:0,pending:day});S.sips=S.sips.filter(x=>x.id!==id);S.sips.push({id,amt,day});S.orders.unshift({id:++S.oid,type:'sip',fund:id,amt,day,st:'active',fresh:1})}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.closest('summary')&&el.dataset.a!=='info')return;
  if(el.id==='knob')return;
  const a=A[el.dataset.a];if(!a)return;
  if(el.dataset.a!=='scrim'||e.target===el)e.preventDefault();
  a(el.dataset.v,el,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)sheet(null)});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='q'){S.q=v;$('xbody').innerHTML=exploreBody()}
  if(k==='bq'){$('bqres').innerHTML=bqList(v)}
  if(k==='tq'){S.tk.q=v;updTrade()}
  if(k==='tp'){S.tk.price=v;updTrade()}
  if(k==='am'){S.amt=+(v.replace(/[^0-9]/g,''))||0;$('am-btn').textContent=`Add ${inr(S.amt,0)}`;$('am-btn').disabled=!S.amt}
  if(k==='ts'){S.ts=+v;document.documentElement.style.setProperty('--ts',S.ts)}
});
document.addEventListener('change',e=>{if(e.target.dataset.in==='fnochk')$('fno-go').disabled=!e.target.checked});

init('investor');render(true);
fetch('data/market.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.stocks&&j.indices){D=j;index();render()}}).catch(()=>{});
})();
